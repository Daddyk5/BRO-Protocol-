name: bro_protocol
description: "BRO PROTOCOL: an AI wingman that writes dating-chat replies. Say less. Say it right."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  dio: 5.11.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  flutter_svg: 2.3.0
  google_fonts: 9.0.0
  image_picker: 1.2.3
  google_mlkit_text_recognition: 0.17.1
  receive_sharing_intent: 1.9.0
  share_plus: 13.3.1
  firebase_core: 4.15.0
  cloud_functions: 6.5.0
  firebase_app_check: 0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0D12"
    theme_color: "#0B0D12"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0D12"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#0B0D12"
    image: "assets/icon/splash_logo.png"
    icon_background_color: "#0B0D12"
  ios: true
  android: true
  fullscreen: false
